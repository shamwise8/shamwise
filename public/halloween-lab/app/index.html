<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#09070d">
<title>Avalanche Halloween · test build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09070d;--ph:#0f0c14;--sf:#18131e;--sf2:#211a29;--ln:#2e2637;
  --tx:#f4eee6;--mu:#a097ab;--or:#ff7a1a;--or2:#ffb36b;--gr:#52d690;
  --c1:#5fb2ff;--c2:#ffcf3f;--c3:#a98dff;--c4:#ff5b4f;
  --disp:"Pirata One",Georgia,serif;--body:"Manrope",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 var(--body);padding-inline:16px;padding-block:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;max-width:1180px;margin-inline:auto}
.phone{position:relative;width:400px;max-width:100%;height:min(840px,calc(100dvh - 32px));background:var(--ph);border:1px solid var(--ln);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;flex:none}
.panel{flex:1;min-width:0;max-width:640px;display:flex;flex-direction:column;gap:14px}
.testbtn{display:none}
@media (max-width:900px){
  .stage{display:block}
  .phone{width:100%;border-radius:24px}
  .panel{display:none}
  .panel.open{display:flex;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;max-width:none}
  .testbtn{display:inline-flex}
}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--ph)}
.ava{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#120c18;background:var(--mu)}
.who{min-width:0;flex:1;line-height:1.2}
.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mu);font:500 11px var(--mono)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:999px;padding:5px 10px;font:700 12px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.or{color:var(--or2);border-color:#5a3418}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.main{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ln);background:var(--ph);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mu);padding:6px 0;border-radius:10px}
.nav button svg{width:20px;height:20px}
.nav button[aria-current="page"]{color:var(--or)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.hot{border-color:#6b3a14;background:linear-gradient(160deg,#2a160b,var(--sf) 60%)}
.h{font-family:var(--disp);font-weight:400;letter-spacing:.3px;margin:0;line-height:1.05}
h2.h{font-size:26px}
h3{margin:0;font-size:15px;font-weight:800}
.mu{color:var(--mu)} .sm{font-size:13px} .xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:#1a0d02;font-weight:800;border-radius:12px;padding:12px 16px;text-align:center}
.btn.ghost{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.done{background:transparent;color:var(--gr);border:1px solid #23573b}
.board{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:14px;overflow:hidden;background:#000}
.tile{position:relative;aspect-ratio:1;overflow:hidden}
.tile .art{position:absolute;inset:0;background-image:var(--art);background-size:200% 200%}
.tile.miss .art{filter:grayscale(1) brightness(.2)}
.tile .lab{position:absolute;left:8px;bottom:8px;right:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.tile .num{font:700 12px var(--mono);background:rgba(9,7,13,.8);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:2px 7px;display:inline-flex;gap:6px;align-items:center}
.tile .q{font:700 12px var(--mono);background:var(--or);color:#1a0d02;border-radius:8px;padding:2px 6px}
.tile.miss .num{border-style:dashed;color:var(--mu)}
.mini{width:64px;height:64px;border-radius:10px;overflow:hidden;position:relative;flex:none;border:2px solid var(--ln)}
.mini .art{position:absolute;inset:0;background-image:var(--art);background-size:200% 200%}
.rar{font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--sf2);border-radius:10px;padding:7px 10px;font:700 13px var(--mono)}
.chip[aria-pressed="true"]{border-color:var(--or);background:#3a1d08;color:var(--or2)}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.li:first-child{border-top:0;padding-top:2px}
.li .grow{flex:1;min-width:0}
.ok{color:var(--gr)}
.bar{height:8px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));border-radius:99px;transition:width .4s}
.tx{font:500 11px var(--mono);color:var(--mu)}
.note{font-size:12.5px;color:var(--or2);background:#2a1709;border:1px solid #5a3418;border-radius:10px;padding:8px 10px}
.land{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px 4px}
.land .h{font-size:58px}
.facedown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facedown div{aspect-ratio:3/4;border-radius:10px;border:2px dashed;display:grid;place-items:center;font:700 12px var(--mono);background:#130f19}
.sheetwrap{position:absolute;inset:0;background:rgba(5,3,8,.72);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--sf);border-top:1px solid var(--ln);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--ln);margin:0 auto -4px}
.toast{position:absolute;left:12px;right:12px;top:66px;z-index:30;background:#1f1508;border:1px solid #6b3a14;color:var(--or2);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;animation:up .2s ease}
.steps{display:flex;flex-direction:column;gap:10px}
.steps div{display:flex;gap:10px;align-items:center;font-size:14px;opacity:0;animation:fadein .3s ease forwards}
@keyframes fadein{to{opacity:1}}
.qr{display:block;width:170px;height:170px;margin:0 auto;border-radius:12px;background:#f4eee6;image-rendering:pixelated}
.nft{position:relative;aspect-ratio:3/4;width:120px;border-radius:12px;overflow:hidden;border:1px solid #6b3a14;background-image:var(--art);background-size:cover;background-position:center;flex:none}
.nft span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 8px;background:linear-gradient(transparent,rgba(9,7,13,.92));font:700 11px var(--mono);text-align:center}
.reveal{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.burn{animation:burn 1.2s ease forwards}
@keyframes burn{40%{filter:brightness(2) sepia(1) saturate(4);transform:scale(1.05)}100%{opacity:0;transform:scale(.7) translateY(-20px);filter:brightness(3) sepia(1)}}
.crewcard{border-radius:18px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;border:2px solid}
.crewcard .h{font-size:46px}
.band{font:700 13px var(--mono);border:1px dashed currentColor;border-radius:8px;padding:4px 10px}
.trophy{position:relative;width:100%;max-width:330px;margin:0 auto;aspect-ratio:1;border-radius:16px;overflow:hidden;border:3px solid #ffb36b;box-shadow:0 0 0 4px #3a1d08,0 0 50px rgba(255,140,40,.35);background-image:var(--art);background-size:cover}
.trophy::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,200,90,.65),rgba(255,140,30,.15) 22%,transparent 40%);mix-blend-mode:screen;animation:glow 2s ease-in-out infinite alternate}

.pack{position:relative;width:200px;height:280px;margin:6px auto 0;border-radius:16px;background:linear-gradient(160deg,#ff7a1a 0%,#a8380e 45%,#5b2a7a 100%);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.18);overflow:visible;touch-action:none;user-select:none}
.pack .body{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;text-align:center;padding:20px}
.pack .body b{font:800 26px/1.05 var(--disp,serif);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.pack .top{position:absolute;left:0;right:0;top:0;height:54px;border-radius:16px 16px 0 0;background:linear-gradient(160deg,#ffb36b,#ff7a1a);border-bottom:2px dashed rgba(255,255,255,.75);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:2;transition:transform .25s}
.pack .zip{width:30px;height:30px;border-radius:50%;background:#fff;color:#5a1f07;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:grab;flex:none;transition:transform .05s}
.pack .hint{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#5a1f07}
.pack.ripped .top{animation:flyoff .7s cubic-bezier(.3,.1,.6,1) forwards}
.pack.ripped .card{animation:rise .7s .25s cubic-bezier(.2,1.3,.4,1) forwards}
.pack .card{position:absolute;left:14px;right:14px;top:30px;bottom:14px;border-radius:12px;background:#140c1c;border:2px solid #ffb36b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:12px;z-index:1;opacity:0}
@keyframes flyoff{to{transform:translate(160px,-120px) rotate(35deg);opacity:0}}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:1;transform:translateY(-36px) scale(1.04)}}
.locks{display:flex;flex-direction:column;gap:6px}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.trophy span{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;background:linear-gradient(transparent,rgba(9,7,13,.9));text-align:center;font:700 13px var(--mono);z-index:2}
.wheelbox{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:6px auto 0}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;border:5px solid #2e2637;box-shadow:0 0 0 1px #000,0 0 40px rgba(255,122,26,.18);transition:transform 3.2s cubic-bezier(.15,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel span em{position:absolute;transform:translate(-50%,-50%);font:800 11px var(--body);font-style:normal;white-space:nowrap}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-top:22px solid var(--or);z-index:2;filter:drop-shadow(0 2px 3px #000)}
.hub{position:absolute;inset:38%;border-radius:50%;background:var(--ph);border:3px solid var(--or);display:grid;place-items:center;font-family:var(--disp);font-size:22px;color:var(--or2)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{aspect-ratio:1;border-radius:10px;border:2px solid transparent;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:800}
.photo[aria-pressed="true"]{border-color:var(--or)}
textarea{width:100%;min-height:84px;background:var(--ph);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:14px/1.45 var(--body);padding:10px;resize:vertical}
.pcard{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ptitle{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--or)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn[aria-pressed="true"]{background:var(--or);color:#1a0d02;border-color:var(--or)}
.tv{background:#050407;border:1px solid #3a2a1a;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.tvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat b{display:block;font:700 34px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--or2)}
.stat small{display:block;margin-top:6px;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.crewbar{display:flex;height:12px;border-radius:99px;overflow:hidden}
.econ{width:100%;border-collapse:collapse;font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.econ td{padding:5px 0;border-top:1px solid var(--ln)}
.econ td:last-child{text-align:right}
.feed{display:flex;flex-direction:column;gap:6px;font-size:13px}
.feed div{padding:6px 0;border-top:1px solid #1d1624}
.artprev{width:100%;max-width:360px;aspect-ratio:1;border-radius:12px;background-image:var(--art);background-size:cover;border:1px solid var(--ln)}
.file{display:flex;align-items:center;gap:10px;font-size:13px}
.file input{font-size:12px;color:var(--mu);max-width:100%}
@media (max-width:520px){.tvgrid{grid-template-columns:1fr 1fr}.stat b{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
/* ---- test build: real X ---- */
.xmode{display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;font:700 11px var(--mono);letter-spacing:.03em;background:#141019;border-bottom:1px solid var(--ln);color:var(--mu);text-align:left}
.xmode b{color:var(--or2);flex:none}.xmode.live b{color:var(--gr)}
.xmode .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xmode u{flex:none}
.shot{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--ln)}.shot[hidden]{display:none}
.chips{display:flex;flex-direction:row;gap:6px}.chips button{flex:none;width:auto;white-space:nowrap;background:var(--sf2);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.chips button[aria-pressed="true"]{border-color:var(--or);color:var(--or2)}
.xlog{background:var(--ph);border:1px solid var(--ln);border-radius:10px;padding:10px;font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;color:#d9d2e0}
.xin{width:100%;background:var(--ph);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:16px var(--body);padding:12px}
a.btn,label.btn{text-decoration:none;cursor:pointer}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <header class="top" id="top"></header>
    <button class="xmode" id="xmode" data-act="xinfo"></button>
    <main class="main" id="main"></main>
    <nav class="nav" id="nav" aria-label="App sections"></nav>
    <div id="layer"></div>
  </div>
  <aside class="panel" id="panel" aria-label="Prototype controls"></aside>
</div>

<script>
(function(){
const CREW={1:{n:'Wolfi',sub:'Avalanche',c:'#5fb2ff',r:'Common',band:'blue'},2:{n:'Coq',sub:'Coq Inu',c:'#ffcf3f',r:'Common',band:'yellow'},3:{n:'Bob',sub:'The Grotto',c:'#a98dff',r:'Uncommon',band:'purple'},4:{n:'Team1 TH',sub:'Team1 Thailand',c:'#ff5b4f',r:'Rare',band:'red'}};
const WEIGHTS={1:32,2:32,3:26,4:10};
const POS={1:'0% 0%',2:'100% 0%',3:'0% 100%',4:'100% 100%'};
const SEG=[['piece','Your piece','#2a2233'],['potion','Potion!','#14404a'],['spin','+1 spin','#221b2b'],['piece','Your piece','#2a2233'],['boo','Boo!','#17121d'],['potion','Potion!','#14404a'],['loot','Lootbox','#3b2a60'],['piece','Your piece','#2a2233'],['potion','Potion!','#14404a'],['kspin','Keychain','#ff9a3d']];
const MERCH={tote:'Team1 tote bag',postcard:'Avalanche Halloween postcard',sticker:'Sticker set (first trade)',pen:'Pen (assist)',keychain:'Special keychain (feedback)',kspin:'Special keychain (rare spin)',loot:'Grotto lootbox (digital)'};
const PACK=[['other',45],['spins',35],['potion',15],['loot',5]];
const BOOTHS=['Team1 · Avalanche Cascade','Merchant & claim desk','The Grotto','Stonk'];
const WAVES=['17:30 Doors','19:30 Wave 2','21:00 Wave 3'];
const CAP=4;
const NPC0=[
  {h:'@cascade_kid',crew:4,p:{1:0,2:1,3:0,4:3}},
  {h:'@mintmali',crew:1,p:{1:3,2:1,3:0,4:0}},
  {h:'@coqcrew_bkk',crew:2,p:{1:0,2:4,3:1,4:0}},
  {h:'@grotto_fan',crew:3,p:{1:1,2:0,3:3,4:0}},
  {h:'@pumpkinpat',crew:3,p:{1:1,2:1,3:2,4:0}},
  {h:'@nong_avax',crew:1,p:{1:2,2:0,3:1,4:1}}
];
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const hex=n=>{let s='';for(let i=0;i<n;i++)s+='0123456789abcdef'[Math.floor(Math.random()*16)];return s};
const short=()=>'0x'+hex(4)+'…'+hex(4);
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let G,U,tab='home',wheelRot=0,spinning=false,tr=null,fbAns={},panelOpen=false,forceCrew=0,guides=false,staffTab='tote';
const custom={1:null,2:null,3:null,4:null,scene:null};

/* ---------- test build: real X through /api/xlab ---------- */
// Real when the server has X keys and the guest is logged in: login, both posts, the repost, the follow checks.
// Simulated always: wallet, crews, wheel, trades, staff scans, the room.
const X={configured:false,user:null,defaults:{},locked:false,redirectUri:'',photo:null,f:{},capMode:'test',cap:{},postId:'',anyway:false};
const live=()=>X.configured&&!!X.user;
const HAS_LINK=/(https?:\/\/[^\s]+)|(^|\s)(?:[a-z0-9-]+\.)+[a-z]{2,}(?:\/\S*)?/i;
const UA=navigator.userAgent||'';
const ANDROID=/Android/.test(UA),IOS=!ANDROID&&(/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1));
const INAPP=/\bLine\//i.test(UA)?'LINE':/Twitter/i.test(UA)?'X':/Instagram/i.test(UA)?'Instagram':/FBAN|FBAV|FB_IAB/i.test(UA)?'Facebook':/TikTok|musical_ly|Bytedance/i.test(UA)?'TikTok':(ANDROID&&/; wv\)/.test(UA))||(IOS&&!/Safari\//.test(UA))?'this app':'';
const HERE=location.origin+location.pathname;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function xapi(action,body){
  try{
    const r=await fetch('/api/xlab/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),credentials:'same-origin'});
    const j=await r.json().catch(()=>({}));j.http=r.status;if(!j.steps)j.steps=[];
    if(r.status===401&&!j.locked)X.user=null;
    return j;
  }catch(e){return {ok:false,http:0,steps:[],error:'The request never reached the server: '+e.message}}
}
// Any refusal from X is shown word for word, so it can be screenshotted. Nothing is credited on a failure.
function xFail(title,j){
  const L=[];const body=b=>typeof b==='string'?b:JSON.stringify(b);
  if(j.error)L.push(j.error);
  if(!j.steps.length&&!j.error)L.push(`The server answered HTTP ${j.http||'?'} with no detail. Usually a timeout.`);
  for(const st of j.steps){
    if(st.method==='NOTE'){L.push('• '+st.label+(st.body?'\n  '+body(st.body):''));continue}
    L.push(`${st.status||'ERR'} ${st.method} ${st.url}\n  ${st.label}`);

// Phones shoot 3 to 12 MB and often HEIC; X takes JPEG up to 5 MB and the server 4.5 MB per request. Shrink first.
async function xPrep(file){
  let src,w,h,url='';
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height}
  catch(_){url=URL.createObjectURL(file);src=new Image();src.src=url;await src.decode();w=src.naturalWidth;h=src.naturalHeight}
  const k=Math.min(1,1600/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);if(url)URL.revokeObjectURL(url);
  const dataUrl=cv.toDataURL('image/jpeg',.82);if(!dataUrl.startsWith('data:image/jpeg'))throw new Error('this browser could not encode a JPEG');
  return {dataUrl};
}

/* ---------- QR ---------- */
function paintQRs(){
  document.querySelectorAll('canvas[data-qr]').forEach(cv=>{
    const seed=cv.dataset.qr+Math.floor(Date.now()/30000);let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
    const r=()=>{s=(s*1103515245+12345)>>>0;return (s>>>16)/65536};
    const x=cv.getContext('2d'),n=25;x.fillStyle='#f4eee6';x.fillRect(0,0,n,n);x.fillStyle='#0f0c14';
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(r()<.48)x.fillRect(i,j,1,1);
    [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillStyle='#0f0c14';x.fillRect(a,b,7,7);x.fillStyle='#f4eee6';x.fillRect(a+1,b+1,5,5);x.fillStyle='#0f0c14';x.fillRect(a+2,b+2,3,3)});
  });
}

  if(spares()<3||G.lootMerchant<1)return;
  U.p[U.crew]-=3;G.lootMerchant--;U.merch.loot=(U.merch.loot||0)+1;
  if(U.crew===4)G.merchantReserve+=3;
  tx(`Burn 3 ${CREW[U.crew].n} · Grotto lootbox`);render();
  sheet(`<h2 class="h" style="text-align:center">Merchant's swap</h2><p style="margin:0;text-align:center;font-size:20px;font-weight:800;color:var(--or2)">Grotto lootbox</p><p class="sm mu" style="margin:0;text-align:center">Sent to your wallet.</p><button class="btn full" data-act="close">Done</button>`);
}
function donate(){
  const total=[1,2,3,4].reduce((s,i)=>s+U.p[i],0);if(!total){toast('No pieces to donate');return}
  sheet(`<h2 class="h">Donate ${total} pieces?</h2><p class="sm" style="margin:0">They go back to the Merchant for someone else to finish. You get a sticker pack.</p><button class="btn full" data-act="donateok">Donate and leave</button><button class="btn ghost full" data-act="close">Keep playing</button>`);
}
function donateOk(){G.merchantReserve+=U.p[4];[1,2,3,4].forEach(i=>U.p[i]=0);U.merch.sticker=(U.merch.sticker||0)+1;tx('Return pieces · Merchant');feed(`${U.h} donated pieces to the Merchant`);closeSheet();render();toast('Thanks. Sticker pack added to your rewards.')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='bg'){if(e.target===el)closeSheet();return}
  switch(a){
    case 'login':login();break;
    case 'xinfo':xInfo();break;
    case 'xcopy':xCopy(HERE);break;
    case 'xcopycb':xCopy(X.redirectUri||'');break;
    case 'xanyway':X.anyway=true;login();break;
    case 'xcap':{const t=$('#cap');X.cap[X.capMode]=t.value;X.capMode=v;t.value=X.cap[v];document.querySelectorAll('[data-act="xcap"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));break}
    case 'xdelete':xDelete(el);break;
    case 'xlogout':xLogout();break;
    case 'xpass':xBoot(($('#xpw').value||'').trim());break;
    case 'auth':auth();break;
    case 'close':closeSheet();break;
    case 'tab':tab=v;closeSheet();render();$('#main').scrollTop=0;break;
    case 'gospin':tab='spin';closeSheet();render();break;
    case 'tote':toteDesk();break;
    case 'force':forceCrew=+v;renderPanel();break;
    case 'spin':doSpin();break;
    case 'task':doTask(v);break;
    case 'compose':compose();break;
    case 'photo':document.querySelectorAll('[data-act="photo"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));break;
    case 'post':doPost();break;
    case 'booth':boothSheet(+v);break;
    case 'scan':openPack(+v);break;
    case 'npc':tr=null;tradeSheet(+v);break;
    case 'tgive':tr.give=+v;tradeSheet(tr.i);break;
    case 'tget':tr.get=+v;tradeSheet(tr.i);break;
    case 'propose':propose();break;
    case 'claim':claimSheet();break;
    case 'redeem':redeem();break;
    case 'fb':fbAns={};feedbackSheet();break;
    case 'fbopen':U.fbOpened=1;G.fbClicks=(G.fbClicks||0)+1;logA('App',`${U.h} opened feedback form`);setTimeout(feedbackSheet,300);break;
    case 'fbsubmit':fbSubmit();break;
    case 'fbgrant':fbGrant();break;
    case 'drop':claimDrop();break;
    case 'dropgrant':dropGrant();break;
    case 'shop':shop();break;
    case 'donate':donate();break;
    case 'donateok':donateOk();break;
    case 'wave':G.wave=+v;feed(`${WAVES[G.wave]}`);if(G.wave>=1)toast('Feedback rewards are open at the Merchant');render();break;
    case 'room10':G.posts+=10;checkGoals();render();break;
    case 'npcdone':{if(G.pantsClaimed<G.pantsCap){G.pantsClaimed++;const h=rnd(['@siam_dev','@kubkid','@farmer_tee','@lootghost','@zilla_nft']);feed(`${h} became Halloween Champion #${G.pantsClaimed}`);const a2=rnd(Object.keys(G.assisters).filter(k=>k!==U.h));G.assisters[a2]++}render();break}
    case 'reset':try{sessionStorage.removeItem('hw_state')}catch(_){}X.f={};init();wheelRot=0;closeSheet();render();break;
    case 'panel':panelOpen=!panelOpen;renderPanel();break;
    case 'stab':staffTab=v;renderPanel();break;
    case 'stote':toteDesk();renderPanel();break;
    case 'shand':U.handed[v]=1;logA('Merchant',`${U.h} ${MERCH[v]||v} handed`);renderPanel();break;
    case 'sdrop':dropGrant();renderPanel();break;
    case 'sredeem':claimSheet();setTimeout(redeem,300);break;
    case 'srelease':{const n=Math.min(5,G.merchantReserve);G.merchantReserve-=n;G.dropPool+=n;logA('Admin',`released ${n} × Team1 TH to the drop`);feed(`Merchant drop: ${n} Team1 TH pieces live at Booth 2`);render();break}
    case 'pack':packSheet();break;
    case 'rip':ripPack();break;
    case 'potion':potionSheet();break;
    case 'drank':closeSheet();feed(`${U.h} drank a potion`);toast('Potion down. The ghosts approve.');break;
    case 'guides':guides=!guides;paintArt();renderPanel();break;
  }
});
document.addEventListener('change',async e=>{
  if(!e.target.dataset||!e.target.dataset.xphoto)return;
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f){toast('No photo came back. The camera may be blocked in this browser.');return}
  try{
    X.photo=await xPrep(f);const im=$('#shot');if(im){im.src=X.photo.dataUrl;im.hidden=false}
    const b=document.querySelector('[data-act="post"]');if(b){b.disabled=false;b.textContent='Post to X'}
  }catch(err){X.photo=null;toast('This browser could not read that photo: '+(err.message||err))}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.file;if(!k||!e.target.files[0])return;
  const img=new Image();img.onload=()=>{custom[k]=img;paintArt()};img.src=URL.createObjectURL(e.target.files[0]);

/* ---------- scene art (original placeholders) ---------- */
function creature(x,cx,cy,col,letter){
  x.save();x.translate(cx,cy);
  const g=x.createRadialGradient(-30,-40,10,0,0,150);g.addColorStop(0,'#fff');g.addColorStop(.12,col);g.addColorStop(1,shade(col,-.45));
  x.fillStyle=g;x.beginPath();x.moveTo(0,-130);x.bezierCurveTo(95,-130,120,-30,115,40);x.bezierCurveTo(110,120,60,140,0,140);x.bezierCurveTo(-60,140,-110,120,-115,40);x.bezierCurveTo(-120,-30,-95,-130,0,-130);x.fill();
  x.fillStyle=shade(col,-.55);x.beginPath();x.moveTo(-70,-105);x.lineTo(-95,-160);x.lineTo(-40,-122);x.fill();x.beginPath();x.moveTo(70,-105);x.lineTo(95,-160);x.lineTo(40,-122);x.fill();
  x.fillStyle='#fff';x.beginPath();x.ellipse(-38,-40,24,28,0,0,7);x.fill();x.beginPath();x.ellipse(38,-40,24,28,0,0,7);x.fill();
  x.fillStyle='#120c18';x.beginPath();x.arc(-32,-34,11,0,7);x.fill();x.beginPath();x.arc(44,-34,11,0,7);x.fill();
  x.strokeStyle='#120c18';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(0,8,22,.15*Math.PI,.85*Math.PI);x.stroke();
  x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.ellipse(0,80,58,44,0,0,7);x.fill();
  x.fillStyle='rgba(18,12,24,.75)';x.font='bold 54px "Pirata One", Georgia, serif';x.textAlign='center';x.textBaseline='middle';x.fillText(letter,0,84);
  x.restore();
}
function shade(hexc,amt){const n=parseInt(hexc.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=c=>Math.max(0,Math.min(255,Math.round(c+(amt<0?c*amt:(255-c)*amt))));return `rgb(${f(r)},${f(g)},${f(b)})`}
function jack(x,cx,cy,r){
  const g=x.createRadialGradient(cx,cy,r*.3,cx,cy,r*2.1);g.addColorStop(0,'rgba(255,150,40,.5)');g.addColorStop(1,'rgba(255,150,40,0)');x.fillStyle=g;x.fillRect(cx-r*2.2,cy-r*2.2,r*4.4,r*4.4);
  x.save();x.translate(cx,cy);
  x.fillStyle='#3e5b24';x.fillRect(-r*.1,-r*1.05,r*.2,r*.32);
  [[-r*.5,r*.55,'#c4520d'],[r*.5,r*.55,'#c4520d'],[-r*.22,r*.6,'#e2690f'],[r*.22,r*.6,'#e2690f'],[0,r*.5,'#f07a14']].forEach(([ox,rx,c])=>{x.fillStyle=c;x.beginPath();x.ellipse(ox,0,rx,r*.8,0,0,7);x.fill()});
  x.fillStyle='#ffd25a';const tri=(ax,ay,s)=>{x.beginPath();x.moveTo(ax,ay-s);x.lineTo(ax+s,ay+s*.7);x.lineTo(ax-s,ay+s*.7);x.fill()};
  tri(-r*.33,-r*.18,r*.17);tri(r*.33,-r*.18,r*.17);tri(0,r*.08,r*.09);
  x.beginPath();x.moveTo(-r*.5,r*.26);for(let t=0;t<=7;t++)x.lineTo(-r*.5+t*(r/7),r*.26+(t%2?r*.1:0));x.quadraticCurveTo(0,r*.78,-r*.5,r*.26);x.fill();
  x.restore();
}
function drawImgIn(x,img,qx,qy){const box=440,s=Math.min(box/img.width,box/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,qx+250-w/2,qy+250-h/2,w,h)}
function paintArt(){
  const c=document.createElement('canvas');c.width=c.height=1000;const x=c.getContext('2d');
  if(custom.scene){x.drawImage(custom.scene,0,0,1000,1000)}
  else{
    const g=x.createLinearGradient(0,0,0,1000);g.addColorStop(0,'#160c2a');g.addColorStop(.5,'#2c1233');g.addColorStop(1,'#3a170b');x.fillStyle=g;x.fillRect(0,0,1000,1000);
    let s=11;const rr=()=>{s=(s*9301+49297)%233280;return s/233280};
    x.fillStyle='#fff';for(let i=0;i<150;i++){x.globalAlpha=.3+rr()*.6;x.beginPath();x.arc(rr()*1000,rr()*380,rr()*1.6+.3,0,7);x.fill()}x.globalAlpha=1;
    const mg=x.createRadialGradient(500,95,20,500,95,200);mg.addColorStop(0,'rgba(255,220,150,.5)');mg.addColorStop(1,'rgba(255,220,150,0)');x.fillStyle=mg;x.fillRect(300,0,400,320);
    x.fillStyle='#f6e6bd';x.beginPath();x.arc(500,95,58,0,7);x.fill();
    x.fillStyle='#0f0814';x.beginPath();x.moveTo(60,430);x.lineTo(60,250);x.lineTo(200,170);x.lineTo(340,250);x.lineTo(340,200);x.lineTo(660,200);x.lineTo(660,250);x.lineTo(800,170);x.lineTo(940,250);x.lineTo(940,430);x.closePath();x.fill();
    x.fillStyle='rgba(255,196,90,.75)';for(let i=0;i<8;i++){x.fillRect(110+i*105,300,26,34)}
    x.fillStyle='rgba(255,236,200,.85)';x.font='30px "Pirata One", Georgia, serif';x.textAlign='center';x.fillText('ZillaSpace',500,240);
    x.fillStyle='#120a14';x.fillRect(0,880,1000,120);
    const fog=x.createLinearGradient(0,820,0,900);fog.addColorStop(0,'rgba(220,210,255,0)');fog.addColorStop(1,'rgba(220,210,255,.18)');x.fillStyle=fog;x.fillRect(0,820,1000,80);
    jack(x,500,500,92);
    x.fillStyle='rgba(255,236,200,.95)';x.font='54px "Pirata One", Georgia, serif';x.textAlign='center';x.fillText('Avalanche Halloween',500,955);
    const Q={1:[0,0],2:[500,0],3:[0,500],4:[500,500]};
    // crossings drawn under bodies where they start
    if(!custom[1]){x.strokeStyle=CREW[1].c;x.lineWidth=26;x.lineCap='round';x.beginPath();x.moveTo(330,300);x.quadraticCurveTo(460,250,580,300);x.stroke();
      x.save();x.translate(600,305);x.rotate(.3);x.fillStyle='#ff4f9a';x.beginPath();x.ellipse(0,0,24,14,0,0,7);x.fill();x.beginPath();x.moveTo(-22,0);x.lineTo(-40,-12);x.lineTo(-40,12);x.fill();x.beginPath();x.moveTo(22,0);x.lineTo(40,-12);x.lineTo(40,12);x.fill();x.restore();
      x.fillStyle=CREW[1].c;x.beginPath();x.arc(582,300,18,0,7);x.fill()}
    if(!custom[3]){const lg=x.createRadialGradient(470,690,10,470,690,190);lg.addColorStop(0,'rgba(190,160,255,.6)');lg.addColorStop(1,'rgba(190,160,255,0)');x.fillStyle=lg;x.fillRect(280,500,380,380);
      x.strokeStyle='#2a2033';x.lineWidth=8;x.beginPath();x.moveTo(350,800);x.lineTo(470,660);x.stroke();x.fillStyle='#e9e0ff';x.fillRect(452,650,36,46);x.strokeStyle=CREW[3].c;x.lineWidth=4;x.strokeRect(452,650,36,46)}
    if(!custom[4]){x.strokeStyle=shade(CREW[4].c,-.15);x.lineWidth=34;x.lineCap='round';x.beginPath();x.moveTo(690,705);x.bezierCurveTo(620,700,610,610,575,575);x.stroke();x.fillStyle=shade(CREW[4].c,-.3);x.beginPath();x.arc(572,572,19,0,7);x.fill()}
    [1,2,3,4].forEach(i=>{const [qx,qy]=Q[i];if(custom[i])drawImgIn(x,custom[i],qx,qy);else creature(x,qx+250,qy+(i>2?250:260),CREW[i].c,i===4?'T1':CREW[i].n[0])});
  }
  if(guides){
    x.setLineDash([12,10]);x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.75)';
    x.beginPath();x.moveTo(500,0);x.lineTo(500,1000);x.moveTo(0,500);x.lineTo(1000,500);x.stroke();
    x.strokeStyle='rgba(82,214,144,.9)';[[0,0],[500,0],[0,500],[500,500]].forEach(([a,b])=>x.strokeRect(a+40,b+40,420,420));
    x.setLineDash([]);x.fillStyle='rgba(82,214,144,.95)';x.font='bold 22px system-ui, sans-serif';x.textAlign='left';x.fillText('face + body safe zone',52,72);
    x.fillStyle='rgba(255,255,255,.9)';x.fillText('cut line',512,30);
  }
  document.documentElement.style.setProperty('--art',`url(${c.toDataURL('image/jpeg',.86)})`);
}

init();
render();
xBoot();
(document.fonts&&document.fonts.load?document.fonts.load('46px "Pirata One"').catch(()=>{}):Promise.resolve()).then(paintArt);
paintArt();
})();
